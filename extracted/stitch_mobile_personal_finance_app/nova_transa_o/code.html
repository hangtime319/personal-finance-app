<body class="bg-background text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary selection:text-on-primary">
<!-- Mobile Viewport Shell (Max Width 480px / 9:16 layout) -->
<div class="w-full max-w-md bg-surface min-h-screen flex flex-col relative pb-28">
<!-- Top App Bar / Modal Header -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md px-margin-mobile h-16 flex items-center justify-between border-b border-outline-variant/20">
<button aria-label="Voltar ou fechar" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-headline-sm">close</span>
</button>
<h1 class="text-headline-sm font-headline-sm text-on-surface tracking-tight">Lançamento manual</h1>
<div class="w-10 h-10 flex items-center justify-center">
<button class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" title="Informações e Ajuda" type="button">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
</button>
</div>
</header>
<!-- Scrollable Content Canvas -->
<main class="flex-1 px-margin-mobile pt-4 pb-6 flex flex-col gap-6">
<!-- Segmented Type Selector (Despesa vs Receita) -->
<section aria-label="Tipo de transação" class="bg-surface-container-low p-1.5 rounded-2xl border border-outline-variant/30 flex items-center gap-1 shadow-inner" role="radiogroup">
<button aria-checked="true" class="flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 bg-secondary-container text-white shadow-md" id="btn-expense" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_outward</span>
<span class="">Despesa</span>
</button>
<button aria-checked="false" class="flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container" id="btn-income" role="radio" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_downward</span>
<span class="">Receita</span>
</button>
</section>
<!-- Amount Input Card (Keypad-inspired heroic hero) -->
<section class="bg-surface-container rounded-3xl p-5 border border-outline-variant/20 relative overflow-hidden shadow-lg">
<div class="absolute -right-10 -top-10 w-32 h-32 bg-secondary/5 rounded-full blur-2xl pointer-events-none" id="ambient-glow"></div>
<div class="flex items-center justify-between mb-1">
<span class="text-body-sm font-body-sm text-on-surface-variant">Valor da transação</span>
<span class="text-label-sm font-label-sm px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant/30">BRL (R$)</span>
</div>
<div class="flex items-baseline gap-2 py-2">
<span class="text-headline-md font-headline-md text-secondary transition-colors" id="amount-prefix">R$</span>
<input aria-label="Valor monetário" class="w-full bg-transparent border-none p-0 text-numeric-balance font-numeric-balance tracking-tight focus:ring-0 focus:outline-none text-on-surface placeholder:text-on-surface-variant/40" id="amount-input" inputmode="decimal" placeholder="0,00" type="text" value="142,50">
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant/70 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
          Toque para editar o montante
        </p>
</section>
<!-- Transaction Fields Group -->
<section class="space-y-4">
<!-- Title Input -->
<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center gap-1.5" for="title-input">
<span class="material-symbols-outlined text-[16px] text-primary">edit_note</span>
            Título da transação <span class="text-secondary">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low border border-outline-variant/30 rounded-2xl px-4 text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="title-input" name="title" placeholder="Ex: Supermercado Mensal" required="" type="text" value="Supermercado Mensal">
</div>
</div>
<!-- Date & Category Grid Split -->
<div class="grid grid-cols-1 gap-4">

<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center gap-1.5" for="date-input">
<span class="material-symbols-outlined text-[16px] text-primary">calendar_today</span>
              Data do Registro <span class="text-secondary">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low border border-outline-variant/30 rounded-2xl px-4 text-body-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="date-input" type="date" value="2025-05-18">
</div>
</div>
<!-- Mandatory Category Selector -->
<div class="flex flex-col gap-1.5">

<span class="material-symbols-outlined text-[16px] text-primary">category</span>

</label>
<div class="relative">

<option selected="" value="alimentacao">Alimentação</option>
<option value="farmacia">Farmácia</option>
<option value="conta_fixa">Conta Fixa</option>
<option value="gasto_extra">Gasto Extra</option>
<option value="transporte">Transporte</option>
</select>
<!-- Dynamic Category Icon Anchor -->
<div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none flex items-center justify-center text-primary" id="category-icon-wrapper">
<span class="material-symbols-outlined text-[20px]" id="current-category-icon">restaurant</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant flex items-center">
<span class="material-symbols-outlined text-[22px]">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Quick Tags / Category Pills for fast thumb selection -->
<div class="space-y-1.5 pt-1">
<span class="text-label-sm font-label-sm text-on-surface-variant/80">Seleção Rápida</span>
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
<button class="category-chip active flex-shrink-0 px-3 py-1.5 rounded-full bg-primary/20 border border-primary/40 text-primary font-label-sm text-label-sm flex items-center gap-1.5 hover:bg-primary/30 transition-all" onclick="setCategory('alimentacao')" type="button">
<span class="material-symbols-outlined text-[16px]">restaurant</span>
<span class="">Alimentação</span>
</button>
<button class="category-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm flex items-center gap-1.5 hover:text-on-surface transition-all" onclick="setCategory('farmacia')" type="button">
<span class="material-symbols-outlined text-[16px]">medication</span>
<span class="">Farmácia</span>
</button>
<button class="category-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm flex items-center gap-1.5 hover:text-on-surface transition-all" onclick="setCategory('conta_fixa')" type="button">

</button>
<button class="category-chip flex-shrink-0 px-3 py-1.5 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm flex items-center gap-1.5 hover:text-on-surface transition-all" onclick="setCategory('gasto_extra')" type="button">

</button>

<span class="">Transporte</span>
</button>

<!-- Optional Observation / Attachment Input -->
<div class="flex flex-col gap-1.5 pt-1">
<label class="text-label-md font-label-md text-on-surface-variant flex items-center justify-between" for="obs-input">
<span class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-tertiary">notes</span>
              Observações &amp; Comprovante
            </span>
<span class="text-label-sm font-label-sm text-outline">Opcional</span>
</label>
<div class="relative bg-surface-container-low border border-outline-variant/30 rounded-2xl p-3 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<textarea class="w-full bg-transparent border-0 p-0 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:outline-none resize-none" id="obs-input" placeholder="Adicionar notas sobre o gasto ou anexo..." rows="2"></textarea>
<div class="flex items-center justify-between pt-2 mt-2 border-t border-outline-variant/20">
<button class="inline-flex items-center gap-1.5 text-label-sm font-label-sm text-on-surface-variant hover:text-primary px-2.5 py-1 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">attach_file</span>
<span class="">Anexar Recibo</span>
</button>
<div class="flex items-center gap-1 text-label-sm font-label-sm text-outline">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="">Criptografado</span>
</div>
</div>
</div>

<!-- Primary Save Button (Fixed Ergonomic Thumb Zone) -->
<div class="pt-2">
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-primary-fixed active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface cursor-pointer" id="btn-save" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="">Salvar Transação</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar (Mandatory Shell Component from JSON Blueprint) -->
<!-- JSON: label_texts: ["Início", "Extrato", "Relatórios", "Perfil"], icons: ["dashboard", "receipt_long", "pie_chart", "person"] -->
<nav aria-label="Navegação Principal" class="fixed bottom-0 left-0 w-full z-50 bg-surface-container dark:bg-surface-container border-t border-outline-variant/30 backdrop-blur-md shadow-lg flex justify-around items-center px-margin-mobile py-2 max-w-md mx-auto right-0">
<!-- Início -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-label-sm text-label-sm py-1 hover:text-primary dark:hover:text-primary transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined text-[22px]">dashboard</span>
<span class="text-label-sm font-label-sm mt-0.5">Início</span>
</a>
<!-- Extrato (Active destination for transaction record intent) -->
<a aria-current="page" class="flex flex-col items-center justify-center text-primary dark:text-primary font-label-md text-label-sm py-1 hover:text-primary dark:hover:text-primary transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="text-label-sm font-label-sm mt-0.5">Extrato</span>
</a>
<!-- Relatórios -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-label-sm text-label-sm py-1 hover:text-primary dark:hover:text-primary transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined text-[22px]">pie_chart</span>
<span class="text-label-sm font-label-sm mt-0.5">Relatórios</span>
</a>
<!-- Perfil -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant font-label-sm text-label-sm py-1 hover:text-primary dark:hover:text-primary transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined text-[22px]">person</span>
<span class="text-label-sm font-label-sm mt-0.5">Perfil</span>
</a>
</nav>
</div>
<!-- Interactive Logic for State Handling -->
<script>
    const btnExpense = document.getElementById('btn-expense');
    const btnIncome = document.getElementById('btn-income');
    const amountPrefix = document.getElementById('amount-prefix');
    const ambientGlow = document.getElementById('ambient-glow');
    const categorySelect = document.getElementById('category-select');
    const currentCategoryIcon = document.getElementById('current-category-icon');
    const btnSave = document.getElementById('btn-save');

    const categoryIconMap = {
      'alimentacao': 'restaurant',
      'farmacia': 'medication',
      'conta_fixa': 'receipt',
      'gasto_extra': 'shopping_bag',
      'transporte': 'directions_car'
    };

    let isExpense = true;

    btnExpense.addEventListener('click', () => {
      isExpense = true;
      btnExpense.setAttribute('aria-checked', 'true');
      btnIncome.setAttribute('aria-checked', 'false');
      
      // Expense visual active state (Coral / Red Accent)
      btnExpense.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 bg-secondary-container text-white shadow-md";
      btnIncome.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container";
      
      amountPrefix.classList.remove('text-primary');
      amountPrefix.classList.add('text-secondary');
      ambientGlow.className = "absolute -right-10 -top-10 w-32 h-32 bg-secondary/10 rounded-full blur-2xl pointer-events-none transition-all duration-300";
    });

    btnIncome.addEventListener('click', () => {
      isExpense = false;
      btnExpense.setAttribute('aria-checked', 'false');
      btnIncome.setAttribute('aria-checked', 'true');
      
      // Income visual active state (Emerald / Green Accent)
      btnIncome.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 bg-primary text-on-primary shadow-md";
      btnExpense.className = "flex-1 py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container";
      
      amountPrefix.classList.remove('text-secondary');
      amountPrefix.classList.add('text-primary');
      ambientGlow.className = "absolute -right-10 -top-10 w-32 h-32 bg-primary/10 rounded-full blur-2xl pointer-events-none transition-all duration-300";
    });

    function setCategory(value) {
      categorySelect.value = value;
      updateCategoryIcon(value);
      
      // Update chip styles
      document.querySelectorAll('.category-chip').forEach(chip => {
        chip.classList.remove('bg-primary/20', 'border-primary/40', 'text-primary');
        chip.classList.add('bg-surface-container-low', 'border-outline-variant/30', 'text-on-surface-variant');
      });
      event.currentTarget.classList.remove('bg-surface-container-low', 'border-outline-variant/30', 'text-on-surface-variant');
      event.currentTarget.classList.add('bg-primary/20', 'border-primary/40', 'text-primary');
    }

    function updateCategoryIcon(categoryKey) {
      const icon = categoryIconMap[categoryKey] || 'category';
      currentCategoryIcon.textContent = icon;
    }

    categorySelect.addEventListener('change', (e) => {
      updateCategoryIcon(e.target.value);
    });

    // Save Feedback interaction
    btnSave.addEventListener('click', () => {
      const originalText = btnSave.innerHTML;
      btnSave.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Salvando...</span>`;
      btnSave.classList.add('opacity-90');
      
      setTimeout(() => {
        btnSave.innerHTML = `<span class="material-symbols-outlined text-[20px]">done_all</span><span>Transação Registrada!</span>`;
        btnSave.classList.remove('bg-primary');
        btnSave.classList.add('bg-primary-container', 'text-white');
        
        setTimeout(() => {
          btnSave.innerHTML = originalText;
          btnSave.classList.remove('bg-primary-container', 'text-white', 'opacity-90');
          btnSave.classList.add('bg-primary', 'text-on-primary');
        }, 1800);
      }, 700);
    });
  </script>


</body></html>
